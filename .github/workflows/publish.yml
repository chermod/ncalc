name: Publish

on:
  push:
    branches: [main]

concurrency: ${{github.workflow}}-${{github.ref}}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Create pull request or pubish
        uses: changesets/action@v1
